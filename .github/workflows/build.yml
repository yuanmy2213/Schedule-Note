name: Build, test and release Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schedule-note-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet run --project tests/JinRiJian.Tests -c Release -- artifacts/test-results/core-tests-linux.json
      - run: python -m pip install openpyxl==3.1.5
      - run: python scripts/verify_xlsx.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-linux-results
          path: artifacts/test-results/
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test, publish and exercise native Windows controls
        shell: pwsh
        run: ./scripts/build.ps1 -Version "1.0.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: |
            artifacts/test-results/
            artifacts/windows-smoke-data/errors.log
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: artifacts/packages/
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core-linux, windows-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: windows-test-results
          path: windows-results
      - uses: actions/download-artifact@v4
        with:
          name: core-linux-results
          path: linux-results
      - name: Attach build evidence
        run: zip -r packages/test-results.zip windows-results linux-results
      - name: Publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.${{ github.run_number }}" packages/* --target "${{ github.sha }}" --title "今日笺 v1.0.${{ github.run_number }}" --notes-file RELEASE_NOTES.md
